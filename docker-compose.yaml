services:
  postgres-db:
    image: postgres:18.3-bookworm
    container_name: database
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - ${PROJECT_ROOT}/out/pgdata:/var/lib/postgresql
    restart: always
  
  db-migrate:
    image: migrate/migrate:v4.19.1
    volumes:
      - ${PROJECT_ROOT}/out/migrations:/migrations
    
  port-forwarder:
    image: alpine/socat:1.8.0.3
    container_name: db-port-forwarder
    command: tcp-listen:5432,fork,reuseaddr tcp-connect:postgres-db:5432
    ports:
      - "127.0.0.1:5433:5432"